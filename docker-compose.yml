# AI-Router data plane. Runtime-agnostic: works with Docker Desktop, Colima, or Podman.
#   Phase 1 (this file):        db  — Postgres 17 + pgvector (source of truth)
#   Phase 2 (profile: monitoring): prometheus + grafana + exporter (observability)
#
# Quickstart:
#   docker compose up -d      # start Postgres only
#   docker compose --profile monitoring up -d   # Phase 2, once the exporter exists
#
# Credentials come from the rule-035 vault, not from a repo-local file. Override
# the location with AI_ROUTER_ENV_FILE if the vault lives somewhere else.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai-router-db
    restart: unless-stopped
    env_file:
      - ${AI_ROUTER_ENV_FILE:-${HOME}/.local/share/agent-projects/ai-router/secrets/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files here run once, in order, on first cluster init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes to a literal $, so these resolve inside the container from
      # env_file above — not on the host, which no longer has a repo-local .env.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
